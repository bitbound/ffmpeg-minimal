name: Build Linux and Windows FFmpeg

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux-windows:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            yasm \
            nasm \
            pkg-config \
            git \
            mingw-w64 \
            mingw-w64-tools \
            gcc-mingw-w64-x86-64 \
            gcc-mingw-w64-i686 \
            g++-mingw-w64-x86-64 \
            g++-mingw-w64-i686

      - name: Clone and build x264 for Linux
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/x264.git x264-linux-source
          cd x264-linux-source
          ./configure \
            --prefix=$PWD/../x264-linux \
            --enable-static \
            --disable-cli
          make -j$(nproc)
          make install

      - name: Clone FFmpeg
        run: |
          git clone --depth 1 --branch release/7.1 https://git.ffmpeg.org/ffmpeg.git ffmpeg-source

      - name: Build Linux AMD64
        run: |
          cd ffmpeg-source
          PKG_CONFIG_PATH=$PWD/../x264-linux/lib/pkgconfig ./configure \
            --prefix=$PWD/../ffmpeg-linux-amd64 \
            --enable-gpl \
            --enable-libx264 \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-doc \
            --disable-htmlpages \
            --disable-manpages \
            --disable-podpages \
            --disable-txtpages \
            --disable-network \
            --disable-debug \
            --disable-sdl2 \
            --disable-iconv \
            --disable-libxcb \
            --disable-libxcb-shm \
            --disable-libxcb-xfixes \
            --disable-libxcb-shape \
            --disable-xlib \
            --disable-zlib \
            --disable-bzlib \
            --disable-lzma \
            --enable-indev=x11grab \
            --enable-indev=lavfi \
            --enable-decoder=rawvideo \
            --enable-encoder=libx264 \
            --enable-protocol=pipe \
            --enable-muxer=mpegts \
            --enable-filter=scale \
            --enable-filter=format \
            --extra-cflags="-I$PWD/../x264-linux/include" \
            --extra-ldflags="-L$PWD/../x264-linux/lib"
          make -j$(nproc)
          make install
          strip ../ffmpeg-linux-amd64/bin/ffmpeg

      - name: Install libx264 for cross-compilation
        run: |
          # Build x264 for Windows 64-bit
          git clone --depth 1 https://code.videolan.org/videolan/x264.git x264-source

          # Build for win64
          cd x264-source
          ./configure \
            --host=x86_64-w64-mingw32 \
            --cross-prefix=x86_64-w64-mingw32- \
            --prefix=$PWD/../x264-win64 \
            --enable-static \
            --disable-cli
          make -j$(nproc)
          make install
          cd ..

          # Clean for win32 build
          cd x264-source
          make distclean
          ./configure \
            --host=i686-w64-mingw32 \
            --cross-prefix=i686-w64-mingw32- \
            --prefix=$PWD/../x264-win32 \
            --enable-static \
            --disable-cli
          make -j$(nproc)
          make install

      - name: Build Windows 64-bit
        run: |
          cd ffmpeg-source
          make distclean || true
          PKG_CONFIG_PATH=$PWD/../x264-win64/lib/pkgconfig ./configure \
            --arch=x86_64 \
            --target-os=mingw32 \
            --cross-prefix=x86_64-w64-mingw32- \
            --prefix=$PWD/../ffmpeg-win64 \
            --enable-gpl \
            --enable-libx264 \
            --enable-cross-compile \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-doc \
            --disable-htmlpages \
            --disable-manpages \
            --disable-podpages \
            --disable-txtpages \
            --disable-network \
            --disable-debug \
            --disable-sdl2 \
            --disable-iconv \
            --disable-zlib \
            --disable-bzlib \
            --disable-lzma \
            --enable-indev=dshow \
            --enable-indev=gdigrab \
            --enable-indev=lavfi \
            --enable-decoder=rawvideo \
            --enable-encoder=libx264 \
            --enable-protocol=pipe \
            --enable-muxer=mpegts \
            --enable-filter=scale \
            --enable-filter=format \
            --extra-cflags="-I$PWD/../x264-win64/include" \
            --extra-ldflags="-L$PWD/../x264-win64/lib"
          make -j$(nproc)
          make install
          x86_64-w64-mingw32-strip ../ffmpeg-win64/bin/ffmpeg.exe

      - name: Build Windows 32-bit
        run: |
          cd ffmpeg-source
          make distclean
          PKG_CONFIG_PATH=$PWD/../x264-win32/lib/pkgconfig ./configure \
            --arch=x86 \
            --target-os=mingw32 \
            --cross-prefix=i686-w64-mingw32- \
            --prefix=$PWD/../ffmpeg-win32 \
            --enable-gpl \
            --enable-libx264 \
            --enable-cross-compile \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-doc \
            --disable-htmlpages \
            --disable-manpages \
            --disable-podpages \
            --disable-txtpages \
            --disable-network \
            --disable-debug \
            --disable-sdl2 \
            --disable-iconv \
            --disable-zlib \
            --disable-bzlib \
            --disable-lzma \
            --enable-indev=dshow \
            --enable-indev=gdigrab \
            --enable-indev=lavfi \
            --enable-decoder=rawvideo \
            --enable-encoder=libx264 \
            --enable-protocol=pipe \
            --enable-muxer=mpegts \
            --enable-filter=scale \
            --enable-filter=format \
            --extra-cflags="-I$PWD/../x264-win32/include" \
            --extra-ldflags="-L$PWD/../x264-win32/lib"
          make -j$(nproc)
          make install
          i686-w64-mingw32-strip ../ffmpeg-win32/bin/ffmpeg.exe

      - name: Upload Linux AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-amd64
          path: ffmpeg-linux-amd64/bin/ffmpeg
          if-no-files-found: error

      - name: Upload Windows 64-bit artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64
          path: ffmpeg-win64/bin/ffmpeg.exe
          if-no-files-found: error

      - name: Upload Windows 32-bit artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win32
          path: ffmpeg-win32/bin/ffmpeg.exe
          if-no-files-found: error
