name: Build Linux

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      ffmpeg_version:
        description: "The FFmpeg version that was built"
        value: ${{ jobs.build-linux.outputs.ffmpeg_version }}

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      ffmpeg_version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            yasm \
            nasm \
            pkg-config \
            git \
            zip

      - name: Clone and build libvpx for Linux
        run: |
          git clone --depth 1 --branch v1.14.1 https://chromium.googlesource.com/webm/libvpx libvpx-linux-source
          cd libvpx-linux-source
          ./configure \
            --prefix=$PWD/../libvpx-linux \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --enable-vp9 \
            --enable-vp9-highbitdepth \
            --as=yasm
          make -j$(nproc)
          make install

      - name: Clone FFmpeg
        run: |
          git clone --depth 1 --branch release/7.1 https://git.ffmpeg.org/ffmpeg.git ffmpeg-source

      - name: Get FFmpeg version
        id: get-version
        run: |
          cd ffmpeg-source
          VERSION=$(cat RELEASE)
          echo "FFmpeg version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Linux AMD64
        run: |
          cd ffmpeg-source
          PKG_CONFIG_PATH=$PWD/../libvpx-linux/lib/pkgconfig ./configure \
            --prefix=$PWD/../ffmpeg-linux-amd64 \
            --disable-everything \
            --enable-libvpx \
            --enable-indev=x11grab \
            --enable-indev=lavfi \
            --enable-decoder=rawvideo \
            --enable-decoder=vp9 \
            --enable-demuxer=rawvideo \
            --enable-encoder=libvpx_vp9 \
            --enable-protocol=pipe \
            --enable-muxer=webm \
            --enable-muxer=matroska \
            --enable-filter=scale \
            --enable-filter=format \
            --disable-doc \
            --disable-debug \
            --extra-cflags="-I$PWD/../libvpx-linux/include" \
            --extra-ldflags="-L$PWD/../libvpx-linux/lib"
          make -j$(nproc)
          make install
          strip ../ffmpeg-linux-amd64/bin/ffmpeg

      - name: Prepare Linux artifact
        run: |
          mkdir artifact
          cp ffmpeg-linux-amd64/bin/ffmpeg artifact/ffmpeg-linux-amd64
          cp THIRD_PARTY_NOTICES.txt artifact/

      - name: Upload Linux AMD64 artifact
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-linux-amd64
          path: artifact/*
          if-no-files-found: error
          retention-days: 1
