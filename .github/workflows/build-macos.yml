name: Build macOS FFmpeg

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-13  # Intel runner
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install yasm nasm pkg-config

      - name: Clone and build x264
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/x264.git x264-source
          cd x264-source
          ./configure \
            --prefix=$PWD/../x264-install \
            --enable-static \
            --disable-cli
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Clone FFmpeg
        run: |
          git clone --depth 1 --branch release/7.1 https://git.ffmpeg.org/ffmpeg.git ffmpeg-source

      - name: Build macOS Intel
        run: |
          cd ffmpeg-source
          PKG_CONFIG_PATH=$PWD/../x264-install/lib/pkgconfig ./configure \
            --prefix=$PWD/../ffmpeg-macos-intel \
            --enable-gpl \
            --enable-libx264 \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-doc \
            --disable-htmlpages \
            --disable-manpages \
            --disable-podpages \
            --disable-txtpages \
            --disable-network \
            --disable-debug \
            --disable-sdl2 \
            --disable-iconv \
            --disable-zlib \
            --disable-bzlib \
            --disable-lzma \
            --enable-indev=avfoundation \
            --enable-indev=lavfi \
            --enable-decoder=rawvideo \
            --enable-encoder=libx264 \
            --enable-protocol=pipe \
            --enable-muxer=mpegts \
            --enable-filter=scale \
            --enable-filter=format \
            --extra-cflags="-I$PWD/../x264-install/include" \
            --extra-ldflags="-L$PWD/../x264-install/lib"
          make -j$(sysctl -n hw.ncpu)
          make install
          strip ../ffmpeg-macos-intel/bin/ffmpeg

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-intel
          path: ffmpeg-macos-intel/bin/ffmpeg
          if-no-files-found: error

  build-macos-arm64:
    runs-on: macos-14  # Apple Silicon runner
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install yasm nasm pkg-config

      - name: Clone and build x264
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/x264.git x264-source
          cd x264-source
          ./configure \
            --prefix=$PWD/../x264-install \
            --enable-static \
            --disable-cli
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Clone FFmpeg
        run: |
          git clone --depth 1 --branch release/7.1 https://git.ffmpeg.org/ffmpeg.git ffmpeg-source

      - name: Build macOS Apple Silicon
        run: |
          cd ffmpeg-source
          PKG_CONFIG_PATH=$PWD/../x264-install/lib/pkgconfig ./configure \
            --prefix=$PWD/../ffmpeg-macos-arm64 \
            --enable-gpl \
            --enable-libx264 \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-doc \
            --disable-htmlpages \
            --disable-manpages \
            --disable-podpages \
            --disable-txtpages \
            --disable-network \
            --disable-debug \
            --disable-sdl2 \
            --disable-iconv \
            --disable-zlib \
            --disable-bzlib \
            --disable-lzma \
            --enable-indev=avfoundation \
            --enable-indev=lavfi \
            --enable-decoder=rawvideo \
            --enable-encoder=libx264 \
            --enable-protocol=pipe \
            --enable-muxer=mpegts \
            --enable-filter=scale \
            --enable-filter=format \
            --extra-cflags="-I$PWD/../x264-install/include" \
            --extra-ldflags="-L$PWD/../x264-install/lib"
          make -j$(sysctl -n hw.ncpu)
          make install
          strip ../ffmpeg-macos-arm64/bin/ffmpeg

      - name: Upload macOS Apple Silicon artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-arm64
          path: ffmpeg-macos-arm64/bin/ffmpeg
          if-no-files-found: error
